# proxy server media
[[redirects]]
  from = "/v1/metadata/*"
  to = "https://folia-doaw.fly.dev/v1/metadata/:splat"
  status = 200

[[redirects]]
  from = "/server/*"
  to = "https://folia-doaw.fly.dev/:splat"
  status = 200
  
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Opting your Website out of Google's FLoC Network
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "interest-cohort=()"